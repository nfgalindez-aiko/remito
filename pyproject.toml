[project]
name = "remito"
version = "0.1.0"
description = "Foto de un comprobante de compra de kiosco, adentro. Stock con su costo, afuera."
requires-python = ">=3.12"
dependencies = ["pillow>=11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remito"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
